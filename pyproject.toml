[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagi"
version = "1.0.0"
description = "OmniAGI harness: a single-master, self-extending, self-verifying agent harness with an executable tool runtime and closed loop."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kaiclean" }]
keywords = ["agents", "moe", "routing", "harness", "tools", "agent-loop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.8",
  "jsonschema>=4.0",
]

[project.scripts]
omniagi = "omniagi.cli:main"

[project.urls]
Homepage = "https://github.com/kaiclean/omniagi-world-model"
Source = "https://github.com/kaiclean/omniagi-world-model"

[tool.setuptools]
packages = ["omniagi"]

[tool.setuptools.package-data]
omniagi = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["omniagi"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["omniagi"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
