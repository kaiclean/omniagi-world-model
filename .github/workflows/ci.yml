name: OmniAGI Harness Integrity

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest --cov=omniagi --cov-report=term-missing

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

      - name: Dependency audit
        run: python -m pip_audit --progress-spinner off

  harness:
    name: constitution and integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"

      - name: Self-check (registry, constitution, links, hashes, memory)
        run: omniagi check --verbose

      - name: Generated documentation is not stale
        run: omniagi docs --check

      - name: Verify file_hasher produces a real digest
        # Assert on the OUTPUT, not the exit status. The original tool printed
        # "Error: File not found" and exited 0, so a status-only check reported
        # success for a completely broken tool.
        run: |
          set -euo pipefail
          digest="$(omniagi hash OmniAGI.md)"
          echo "digest=${digest}"
          printf '%s' "${digest}" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "::error::file_hasher did not emit a sha256 digest"; exit 1; }

      - name: file_hasher fails loudly on a missing file
        run: |
          if omniagi hash definitely-not-a-real-file.md; then
            echo "::error::hasher exited 0 for a missing file"
            exit 1
          fi

      - name: Watchdog single-shot
        run: omniagi watch --once

      - name: Self-extension demo runs in a temporary harness
        run: omniagi extend --demo

      - name: Verification must not modify the working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::checks mutated tracked files; verification must be read-only"
            git status --porcelain
            git diff
            exit 1
          fi
